server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Pedidos para /api/... são repassados ao auth-service (pela rede interna do Docker).
    # Assim o navegador fala com um único endereço e não há problema de CORS.
    location /api/ {
        proxy_pass http://auth-service:8081;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Qualquer outro caminho entrega o React (index.html).
    location / {
        try_files $uri /index.html;
    }
}
