# Prometheus do HealthSys: lê /actuator/prometheus de cada microsserviço a cada 10 segundos.
global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/alertas.yml

scrape_configs:
  - job_name: api-gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['api-gateway:8080']
  - job_name: auth-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['auth-service:8081']
  - job_name: patient-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['patient-service:8082']
  - job_name: record-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['record-service:8083']
  - job_name: triage-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['triage-service:8084']
  - job_name: notification-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['notification-service:8085']
  - job_name: monitoring-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['monitoring-service:8086']
