server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      default-filters:
        # Repassa o Host original (ex.: localhost:3000), para o header Location das respostas 201 apontar para o endereço público.
        - PreserveHostHeader
      routes:
        # O id de cada rota é usado como nome do serviço na resposta 503 (ver ServicoIndisponivelHandler).
        - id: auth-service
          uri: ${AUTH_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/auth/**,/api/v1/usuarios/**
          filters:
            - name: CircuitBreaker
              args:
                name: authService

        - id: patient-service
          uri: ${PATIENT_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/pacientes/**
          filters:
            - name: CircuitBreaker
              args:
                name: patientService

        - id: record-service
          uri: ${RECORD_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/prontuarios/**
          filters:
            - name: CircuitBreaker
              args:
                name: recordService

        - id: triage-service
          uri: ${TRIAGE_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/v1/triagens,/api/v1/triagens/**
          filters:
            - name: CircuitBreaker
              args:
                name: triageService

        # Canal em tempo real (SSE): conexão longa, por isso fica SEM o circuit breaker (que cortaria em 10 s).
        # Precisa vir antes da rota geral de notificações.
        - id: notification-service-stream
          uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/api/v1/notificacoes/stream

        - id: notification-service
          uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/api/v1/notificacoes,/api/v1/notificacoes/**
          filters:
            - name: CircuitBreaker
              args:
                name: notificationService

        - id: monitoring-service
          uri: ${MONITORING_SERVICE_URL:http://localhost:8086}
          predicates:
            - Path=/api/v1/leitos,/api/v1/leitos/**,/api/v1/monitoramento/**
          filters:
            - name: CircuitBreaker
              args:
                name: monitoringService

# Mesmo segredo do auth-service: o gateway barra tokens inválidos antes de chegarem aos serviços.
jwt:
  secret: ${JWT_SECRET:healthsys-dev-secret-troque-em-producao-0123456789}

management:
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
