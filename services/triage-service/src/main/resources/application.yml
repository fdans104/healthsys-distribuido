server:
  port: ${SERVER_PORT:8084}

spring:
  application:
    name: triage-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/${DB_NAME:healthsys_triage}
    username: ${DB_USER:triage_user}
    password: ${DB_PASSWORD:triage_pass}
  sql:
    init:
      # Executa o schema.sql (idempotente) a cada inicialização: o serviço é dono da sua tabela
      # e consegue atualizar bancos criados antes desta versão sem "docker compose down -v".
      mode: always
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  # Mensageria: os eventos da triagem vão para o tópico "triagem.eventos".
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      properties:
        # Se o Kafka estiver fora do ar, desiste rápido: o evento continua guardado na caixa de saída.
        max.block.ms: 3000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000
        enable.idempotence: true
    admin:
      operation-timeout: 5s
      close-timeout: 5s

# Caixa de saída: de quanto em quanto tempo procura eventos para enviar ao Kafka.
eventos:
  intervalo-ms: 2000
  timeout-envio-ms: 5000

# Mesmo segredo do auth-service: o token é validado localmente (assinatura + expiração + emissor).
jwt:
  secret: ${JWT_SECRET:healthsys-dev-secret-troque-em-producao-0123456789}

# Endereço interno do serviço de pacientes (usado para confirmar o paciente e guardar o nome dele).
servicos:
  pacientes-url: ${PATIENT_SERVICE_URL:http://localhost:8082}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  metrics:
    distribution:
      # Permite calcular o tempo de resposta (percentil 95) no Grafana.
      percentiles-histogram:
        http.server.requests: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
