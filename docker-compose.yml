# Segredo usado para assinar (auth-service) e validar (gateway e demais serviços) os tokens JWT.
# Para trocar sem editar este arquivo: crie um .env na raiz com JWT_SECRET=<no mínimo 32 caracteres>.
x-jwt-env: &jwt-env
  JWT_SECRET: ${JWT_SECRET:-healthsys-dev-secret-troque-em-producao-0123456789}
  # Fuso horário dos serviços Java: datas e horas gravadas no horário de Brasília.
  TZ: America/Sao_Paulo

# RNF09: cada serviço tem o SEU banco, com host, nome, usuário e senha próprios.
# O auth-service nunca enxerga o banco de pacientes, e vice-versa.
x-auth-db-env: &auth-db-env
  DB_HOST: postgres-auth
  DB_PORT: 5432
  DB_NAME: healthsys_auth
  DB_USER: auth_user
  DB_PASSWORD: auth_pass

x-patient-db-env: &patient-db-env
  DB_HOST: postgres-patient
  DB_PORT: 5432
  DB_NAME: healthsys_patients
  DB_USER: patient_user
  DB_PASSWORD: patient_pass

x-triage-db-env: &triage-db-env
  DB_HOST: postgres-triage
  DB_PORT: 5432
  DB_NAME: healthsys_triage
  DB_USER: triage_user
  DB_PASSWORD: triage_pass

x-monitoring-db-env: &monitoring-db-env
  DB_HOST: postgres-monitoring
  DB_PORT: 5432
  DB_NAME: healthsys_monitoring
  DB_USER: monitoring_user
  DB_PASSWORD: monitoring_pass

# Endereço do Kafka dentro da rede do Docker (mensageria entre os serviços).
x-kafka-env: &kafka-env
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092

services:
  # Banco do auth-service (usuários e login). No seu computador: localhost:5432.
  postgres-auth:
    image: postgres:16-alpine
    container_name: healthsys-postgres-auth
    restart: always
    environment:
      POSTGRES_USER: auth_user
      POSTGRES_PASSWORD: auth_pass
      POSTGRES_DB: healthsys_auth
    ports:
      - "5432:5432"
    volumes:
      - postgres_auth_data:/var/lib/postgresql/data
      - ./infra/db/postgres-auth-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth_user -d healthsys_auth"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - healthsys-net

  # Banco do patient-service (pacientes). No seu computador: localhost:5433.
  postgres-patient:
    image: postgres:16-alpine
    container_name: healthsys-postgres-patient
    restart: always
    environment:
      POSTGRES_USER: patient_user
      POSTGRES_PASSWORD: patient_pass
      POSTGRES_DB: healthsys_patients
    ports:
      - "5433:5432"
    volumes:
      - postgres_patient_data:/var/lib/postgresql/data
      - ./infra/db/postgres-patient-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U patient_user -d healthsys_patients"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - healthsys-net

  # Banco do triage-service (triagens). No seu computador: localhost:5434.
  postgres-triage:
    image: postgres:16-alpine
    container_name: healthsys-postgres-triage
    restart: always
    environment:
      POSTGRES_USER: triage_user
      POSTGRES_PASSWORD: triage_pass
      POSTGRES_DB: healthsys_triage
    ports:
      - "5434:5432"
    volumes:
      - postgres_triage_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U triage_user -d healthsys_triage"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - healthsys-net

  # Banco do monitoring-service (leitos e alertas). No seu computador: localhost:5435.
  postgres-monitoring:
    image: postgres:16-alpine
    container_name: healthsys-postgres-monitoring
    restart: always
    environment:
      POSTGRES_USER: monitoring_user
      POSTGRES_PASSWORD: monitoring_pass
      POSTGRES_DB: healthsys_monitoring
    ports:
      - "5435:5432"
    volumes:
      - postgres_monitoring_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U monitoring_user -d healthsys_monitoring"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - healthsys-net

  # Mensageria: Kafka em modo KRaft (sem ZooKeeper), um único nó para o ambiente de desenvolvimento.
  # Tópicos: triagem.eventos, prontuario.eventos e monitoramento.eventos (+ os .DLT de mensagens com problema).
  kafka:
    image: apache/kafka:3.8.0
    container_name: healthsys-kafka
    restart: always
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    networks:
      - healthsys-net

  # Tela para ver os tópicos e as mensagens do Kafka: http://localhost:8090
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: healthsys-kafka-ui
    restart: always
    environment:
      KAFKA_CLUSTERS_0_NAME: healthsys
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports:
      - "8090:8080"
    depends_on:
      - kafka
    networks:
      - healthsys-net

  # IoT: broker MQTT onde os monitores dos leitos publicam os sinais vitais (healthsys/leitos/<leito>/sinais).
  mosquitto:
    image: eclipse-mosquitto:2.0.20
    container_name: healthsys-mosquitto
    restart: always
    ports:
      - "1883:1883"
    volumes:
      - ./infra/mqtt/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    networks:
      - healthsys-net

  # Simulador dos monitores multiparamétricos dos leitos (publica uma leitura por leito a cada 3 s).
  iot-simulator:
    build: ./infra/iot-simulator
    container_name: healthsys-iot-simulator
    restart: always
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      INTERVALO_SEGUNDOS: 3
      # De vez em quando um paciente "piora" sozinho, para gerar alertas (mude para false para desligar).
      PIORA_AUTOMATICA: "true"
    depends_on:
      - mosquitto
    networks:
      - healthsys-net

  # Ponto único de entrada da API: roteia, valida o JWT e aplica circuit breaker.
  api-gateway:
    build: ./services/api-gateway
    container_name: healthsys-api-gateway
    restart: always
    environment:
      <<: *jwt-env
      AUTH_SERVICE_URL: http://auth-service:8081
      PATIENT_SERVICE_URL: http://patient-service:8082
      RECORD_SERVICE_URL: http://record-service:8083
      TRIAGE_SERVICE_URL: http://triage-service:8084
      NOTIFICATION_SERVICE_URL: http://notification-service:8085
      MONITORING_SERVICE_URL: http://monitoring-service:8086
    ports:
      - "8080:8080"
    depends_on:
      - auth-service
      - patient-service
      - record-service
      - triage-service
      - notification-service
      - monitoring-service
    networks:
      - healthsys-net

  auth-service:
    build: ./services/auth-service
    container_name: healthsys-auth-service
    restart: always
    environment:
      <<: [*auth-db-env, *jwt-env]
    ports:
      - "8081:8081"
    depends_on:
      postgres-auth:
        condition: service_healthy
    networks:
      - healthsys-net

  patient-service:
    build: ./services/patient-service
    container_name: healthsys-patient-service
    restart: always
    environment:
      <<: [*patient-db-env, *jwt-env]
      # Cache distribuído: a ficha do paciente fica guardada no Redis por 10 minutos.
      REDIS_HOST: redis
    ports:
      - "8082:8082"
    depends_on:
      postgres-patient:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - healthsys-net

  # Prontuário eletrônico (consultas, exames, medicamentos) no MongoDB (RNF09).
  record-service:
    build: ./services/record-service
    container_name: healthsys-record-service
    restart: always
    environment:
      <<: [*jwt-env, *kafka-env]
      MONGO_URI: mongodb://mongouser:mongopass@mongodb:27017/healthsys_records?authSource=admin
      PATIENT_SERVICE_URL: http://patient-service:8082
    ports:
      - "8083:8083"
    depends_on:
      - mongodb
      - patient-service
      - kafka
    networks:
      - healthsys-net

  # Teletriagem e classificação de risco, com banco próprio.
  triage-service:
    build: ./services/triage-service
    container_name: healthsys-triage-service
    restart: always
    environment:
      <<: [*triage-db-env, *jwt-env, *kafka-env]
      PATIENT_SERVICE_URL: http://patient-service:8082
    ports:
      - "8084:8084"
    depends_on:
      postgres-triage:
        condition: service_healthy
      patient-service:
        condition: service_started
      kafka:
        condition: service_started
    networks:
      - healthsys-net

  # Notificações assíncronas: consome o Kafka e avisa cada perfil em tempo real (banco próprio no MongoDB).
  notification-service:
    build: ./services/notification-service
    container_name: healthsys-notification-service
    restart: always
    environment:
      <<: [*jwt-env, *kafka-env]
      MONGO_URI: mongodb://mongouser:mongopass@mongodb:27017/healthsys_notifications?authSource=admin
    ports:
      - "8085:8085"
    depends_on:
      - mongodb
      - kafka
    networks:
      - healthsys-net

  # Monitoramento hospitalar: leitos, ocupação, sinais vitais via MQTT e alertas (banco próprio).
  monitoring-service:
    build: ./services/monitoring-service
    container_name: healthsys-monitoring-service
    restart: always
    environment:
      <<: [*monitoring-db-env, *jwt-env, *kafka-env]
      PATIENT_SERVICE_URL: http://patient-service:8082
      MQTT_URL: tcp://mosquitto:1883
    ports:
      - "8086:8086"
    depends_on:
      postgres-monitoring:
        condition: service_healthy
      patient-service:
        condition: service_started
      kafka:
        condition: service_started
      mosquitto:
        condition: service_started
    networks:
      - healthsys-net

  frontend:
    build: ./frontend
    container_name: healthsys-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - api-gateway
    networks:
      - healthsys-net

  mongodb:
    image: mongo:7-jammy
    container_name: healthsys-mongodb
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongouser
      MONGO_INITDB_ROOT_PASSWORD: mongopass
      MONGO_INITDB_DATABASE: healthsys_records
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      - ./infra/db/mongo-init:/docker-entrypoint-initdb.d
    networks:
      - healthsys-net

  redis:
    image: redis:7-alpine
    container_name: healthsys-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - healthsys-net

  # Coleta as métricas de todos os serviços a cada 10 s (/actuator/prometheus) e avalia os alertas.
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: healthsys-prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - prometheus_data:/prometheus
      - ./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/monitoring/alertas.yml:/etc/prometheus/alertas.yml:ro
    networks:
      - healthsys-net

  # Painel de monitoramento (dashboard "HealthSys" já vem pronto): http://localhost:3001 (admin / admin)
  grafana:
    image: grafana/grafana:11.2.0
    container_name: healthsys-grafana
    restart: always
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/etc/grafana/dashboards/healthsys.json
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - healthsys-net

volumes:
  postgres_auth_data:
  postgres_patient_data:
  postgres_triage_data:
  postgres_monitoring_data:
  mongo_data:
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  healthsys-net:
    driver: bridge
