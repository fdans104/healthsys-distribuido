# Segredo usado para assinar (auth-service) e validar (api-gateway, patient-service) os tokens JWT.
# Para trocar sem editar este arquivo: crie um .env na raiz com JWT_SECRET=<no mínimo 32 caracteres>.
x-jwt-env: &jwt-env
  JWT_SECRET: ${JWT_SECRET:-healthsys-dev-secret-troque-em-producao-0123456789}

# RNF09: cada serviço tem o SEU banco, com host, nome, usuário e senha próprios.
# O auth-service nunca enxerga o banco de pacientes, e vice-versa.
x-auth-db-env: &auth-db-env
  DB_HOST: postgres-auth
  DB_PORT: 5432
  DB_NAME: healthsys_auth
  DB_USER: auth_user
  DB_PASSWORD: auth_pass

x-patient-db-env: &patient-db-env
  DB_HOST: postgres-patient
  DB_PORT: 5432
  DB_NAME: healthsys_patients
  DB_USER: patient_user
  DB_PASSWORD: patient_pass

services:
  # Banco do auth-service (usuários e login). No seu computador: localhost:5432.
  postgres-auth:
    image: postgres:16-alpine
    container_name: healthsys-postgres-auth
    restart: always
    environment:
      POSTGRES_USER: auth_user
      POSTGRES_PASSWORD: auth_pass
      POSTGRES_DB: healthsys_auth
    ports:
      - "5432:5432"
    volumes:
      - postgres_auth_data:/var/lib/postgresql/data
      - ./infra/db/postgres-auth-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth_user -d healthsys_auth"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - healthsys-net

  # Banco do patient-service (pacientes). No seu computador: localhost:5433.
  postgres-patient:
    image: postgres:16-alpine
    container_name: healthsys-postgres-patient
    restart: always
    environment:
      POSTGRES_USER: patient_user
      POSTGRES_PASSWORD: patient_pass
      POSTGRES_DB: healthsys_patients
    ports:
      - "5433:5432"
    volumes:
      - postgres_patient_data:/var/lib/postgresql/data
      - ./infra/db/postgres-patient-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U patient_user -d healthsys_patients"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - healthsys-net

  # Ponto único de entrada da API: roteia, valida o JWT e aplica circuit breaker.
  api-gateway:
    build: ./services/api-gateway
    container_name: healthsys-api-gateway
    restart: always
    environment:
      <<: *jwt-env
      AUTH_SERVICE_URL: http://auth-service:8081
      PATIENT_SERVICE_URL: http://patient-service:8082
    ports:
      - "8080:8080"
    depends_on:
      - auth-service
      - patient-service
    networks:
      - healthsys-net

  auth-service:
    build: ./services/auth-service
    container_name: healthsys-auth-service
    restart: always
    environment:
      <<: [*auth-db-env, *jwt-env]
    ports:
      - "8081:8081"
    depends_on:
      postgres-auth:
        condition: service_healthy
    networks:
      - healthsys-net

  patient-service:
    build: ./services/patient-service
    container_name: healthsys-patient-service
    restart: always
    environment:
      <<: [*patient-db-env, *jwt-env]
    ports:
      - "8082:8082"
    depends_on:
      postgres-patient:
        condition: service_healthy
    networks:
      - healthsys-net

  frontend:
    build: ./frontend
    container_name: healthsys-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - api-gateway
    networks:
      - healthsys-net

  mongodb:
    image: mongo:7-jammy
    container_name: healthsys-mongodb
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongouser
      MONGO_INITDB_ROOT_PASSWORD: mongopass
      MONGO_INITDB_DATABASE: healthsys_records
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      - ./infra/db/mongo-init:/docker-entrypoint-initdb.d
    networks:
      - healthsys-net

  redis:
    image: redis:7-alpine
    container_name: healthsys-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - healthsys-net

  prometheus:
    image: prom/prometheus:latest
    container_name: healthsys-prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - prometheus_data:/prometheus
      # Em breve, você mapeará o prometheus.yml aqui para ler as métricas do Spring Boot
    networks:
      - healthsys-net

  grafana:
    image: grafana/grafana:latest
    container_name: healthsys-grafana
    restart: always
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - healthsys-net

volumes:
  postgres_auth_data:
  postgres_patient_data:
  mongo_data:
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  healthsys-net:
    driver: bridge
