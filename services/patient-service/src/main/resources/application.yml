server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: patient-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:healthsys_patients}
    username: ${DB_USER:patient_user}
    password: ${DB_PASSWORD:patient_pass}
  sql:
    init:
      # Executa o schema.sql (idempotente) a cada inicialização: o serviço é dono da sua tabela
      # e consegue atualizar bancos criados antes desta versão sem "docker compose down -v".
      mode: always
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  # Cache distribuído: GET /api/v1/pacientes/{id} fica guardado no Redis por 10 minutos (CacheConfig).
  cache:
    type: redis
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Se o Redis cair, desiste rápido e busca no PostgreSQL (o cache é só um atalho).
      timeout: 500ms
      connect-timeout: 500ms

# Mesmo segredo do auth-service: o token é validado localmente (assinatura + expiração + emissor).
jwt:
  secret: ${JWT_SECRET:healthsys-dev-secret-troque-em-producao-0123456789}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  health:
    # O cache é opcional: o serviço continua saudável (e atendendo) mesmo com o Redis fora do ar.
    redis:
      enabled: false
  metrics:
    distribution:
      # Permite calcular o tempo de resposta (percentil 95) no Grafana.
      percentiles-histogram:
        http.server.requests: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
