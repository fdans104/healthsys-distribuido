# Broker MQTT do HealthSys (Eclipse Mosquitto 2).
# Ambiente de desenvolvimento: aceita conexões sem senha, só dentro da rede do Docker e na porta 1883 do seu computador.
# Em produção: exigir usuário e senha (password_file) e TLS (porta 8883), para nenhum aparelho falso enviar dados.
listener 1883
allow_anonymous true
persistence false
log_dest stdout
