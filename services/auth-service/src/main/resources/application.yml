server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: auth-service
  datasource:
    # Valores padrão servem para rodar fora do Docker (Postgres em localhost).
    # Dentro do docker-compose, DB_HOST vira "postgres-auth" (container do banco deste serviço).
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:healthsys_auth}
    username: ${DB_USER:auth_user}
    password: ${DB_PASSWORD:auth_pass}
  jpa:
    hibernate:
      # O schema é criado pelo init.sql; o Hibernate só confere se a entidade bate com a tabela.
      ddl-auto: validate
    open-in-view: false

# Token JWT (HS256). O MESMO segredo é configurado no api-gateway e no patient-service,
# que validam o token sozinhos, sem precisar consultar este serviço a cada requisição.
jwt:
  secret: ${JWT_SECRET:healthsys-dev-secret-troque-em-producao-0123456789}
  expiracao-horas: ${JWT_EXPIRACAO_HORAS:8}

# Administrador garantido na inicialização (ver AdminInicializador).
healthsys:
  admin:
    email: ${ADMIN_EMAIL:admin@healthsys.com}
    senha: ${ADMIN_SENHA:admin123}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
