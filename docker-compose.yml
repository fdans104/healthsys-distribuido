services:
  postgres:
    image: postgres:16-alpine
    container_name: healthsys-postgres
    restart: always
    environment:
      POSTGRES_USER: healthuser
      POSTGRES_PASSWORD: healthpass
      POSTGRES_DB: healthsys_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/db/postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U healthuser -d healthsys_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - healthsys-net

  auth-service:
    build: ./services/auth-service
    container_name: healthsys-auth-service
    restart: always
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: healthsys_db
      DB_USER: healthuser
      DB_PASSWORD: healthpass
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - healthsys-net

  frontend:
    build: ./frontend
    container_name: healthsys-frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - auth-service
    networks:
      - healthsys-net

  mongodb:
    image: mongo:7-jammy
    container_name: healthsys-mongodb
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongouser
      MONGO_INITDB_ROOT_PASSWORD: mongopass
      MONGO_INITDB_DATABASE: healthsys_records
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      - ./infra/db/mongo-init:/docker-entrypoint-initdb.d
    networks:
      - healthsys-net

  redis:
    image: redis:7-alpine
    container_name: healthsys-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - healthsys-net

  prometheus:
    image: prom/prometheus:latest
    container_name: healthsys-prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - prometheus_data:/prometheus
      # Em breve, você mapeará o prometheus.yml aqui para ler as métricas do Spring Boot
    networks:
      - healthsys-net

  grafana:
    image: grafana/grafana:latest
    container_name: healthsys-grafana
    restart: always
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - healthsys-net

volumes:
  postgres_data:
  mongo_data:
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  healthsys-net:
    driver: bridge
