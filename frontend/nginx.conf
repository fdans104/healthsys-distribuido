server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Todo pedido /api/... vai para o API Gateway (pela rede interna do Docker),
    # que decide qual microsserviço atende. O navegador fala com um único endereço: sem CORS.
    location /api/ {
        proxy_pass http://api-gateway:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Qualquer outro caminho entrega o React (index.html).
    location / {
        try_files $uri /index.html;
    }
}
